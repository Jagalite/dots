name: ALSA dependency artifact

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/alsa-dependency.yml
      - scripts/build-alsa-sysroot.sh
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alsa-sysroot:
    name: Debian 13 amd64 ALSA sysroot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: debian:trixie-slim
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install official Debian build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential pkg-config ca-certificates
      - name: Download, verify, extract and smoke-test
        run: bash scripts/build-alsa-sysroot.sh
      - name: Upload verified dependency bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alsa-sysroot-debian-trixie-amd64
          path: |
            dist/alsa-sysroot-debian-trixie-amd64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
