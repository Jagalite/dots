name: ALSA dependency artifact

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/alsa-dependency.yml
      - scripts/build-alsa-sysroot.sh
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alsa-sysroot:
    name: Debian 13 amd64 ALSA sysroot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: debian:trixie-slim
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install official Debian build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential pkg-config ca-certificates
      - name: Download, verify, extract and smoke-test
        run: bash scripts/build-alsa-sysroot.sh
      - name: Upload verified dependency bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alsa-sysroot-debian-trixie-amd64
          path: |
            dist/alsa-sysroot-debian-trixie-amd64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
